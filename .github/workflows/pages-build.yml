name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bun install --frozen-lockfile
      - name: Install verified wasm-bindgen CLI
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-bindgen
          version: "0.2.129"
      - name: Compile Rust reconstruction and feature lab to WebAssembly
        run: bun run wasm:build
      - name: Build static Next.js export
        run: GITHUB_PAGES=true bun --cwd apps/web build
      - name: Verify interactive lab exports
        run: |
          test -f apps/web/out/feature-lab/index.html
          test -f apps/web/out/feature-wasm/video_to_3d_feature_wasm.js
          test -f apps/web/out/feature-wasm/video_to_3d_feature_wasm_bg.wasm
          grep -R -q "Feature matching lab" apps/web/out/feature-lab
          test -f apps/web/out/learned-lab/index.html
          grep -R -q "Learned reconstruction lab" apps/web/out/learned-lab
          test -f apps/web/out/litert-wasm/litert_wasm_internal.js
          test -f apps/web/out/litert-wasm/litert_wasm_internal.wasm
      - name: Upload pull-request static export
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-pages-static-export
          path: apps/web/out
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/out

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
