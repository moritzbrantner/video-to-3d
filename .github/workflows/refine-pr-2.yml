name: Refine PR 2 RANSAC consensus

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refine RANSAC consensus before pose recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/video-to-3d-core/src/two_view.rs')
          text = path.read_text()
          marker = '''    let inlier_ratio = best_inliers.len() as f64 / correspondences.len() as f64;\n'''
          replacement = '''    // Refit the best RANSAC consensus and reclassify all correspondences.\n    // Eight-point minimal samples are deliberately noisy after integer-pixel feature\n    // quantization; local consensus optimization keeps the robust threshold while\n    // allowing the overdetermined fit to recover legitimate inliers.\n    for _ in 0..2 {\n        let Some(refined_essential) = estimate_essential(&correspondences, &best_inliers) else {\n            break;\n        };\n        let mut refined_inliers = Vec::new();\n        let mut refined_errors = Vec::new();\n        for (index, correspondence) in correspondences.iter().enumerate() {\n            let error = sampson_error(&refined_essential, correspondence);\n            if error.is_finite() && error <= threshold {\n                refined_inliers.push(index);\n                refined_errors.push(error);\n            }\n        }\n\n        let refined_median_error = median_f64(&mut refined_errors);\n        let improves_consensus = refined_inliers.len() > best_inliers.len()\n            || (refined_inliers.len() == best_inliers.len()\n                && refined_median_error < best_median_error);\n        if !improves_consensus {\n            break;\n        }\n        best_inliers = refined_inliers;\n        best_median_error = refined_median_error;\n    }\n\n    let inlier_ratio = best_inliers.len() as f64 / correspondences.len() as f64;\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          cargo fmt --all
      - name: Verify translating two-view fixture
        run: cargo test -p video-to-3d-core two_view::tests::recovers_translating_two_view_fixture_with_outliers
      - name: Commit estimator refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video-to-3d-core/src/two_view.rs
          git commit -m "Refine two-view RANSAC consensus"
          git push origin HEAD:feat/calibrated-two-view-sfm
