name: Fix eight-point null space

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Fix minimal eight-point SVD and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/video-to-3d-core/src/two_view.rs')
          text = path.read_text()

          design = '    let mut design = DMatrix::<f64>::zeros(indices.len(), 9);'
          replacement = '''    // nalgebra computes a thin SVD for rectangular matrices. For the minimal
    // eight-point fit, an 8x9 design matrix would therefore expose only eight
    // right-singular vectors and omit the one-dimensional null space that is the
    // actual essential-matrix solution. A zero row preserves the linear system
    // while making the minimal design square so V^T contains all nine vectors.
    let mut design = DMatrix::<f64>::zeros(indices.len().max(9), 9);'''
          if text.count(design) != 1:
              raise SystemExit(f'expected one design matrix marker, found {text.count(design)}')
          text = text.replace(design, replacement, 1)

          marker = '''    #[test]\n    fn triangulates_known_two_view_point() {'''
          tests = '''    fn exact_correspondences(\n        rotation: Matrix3<f64>,\n        translation: Vector3<f64>,\n    ) -> Vec<Correspondence> {\n        let points = [\n            Vector3::new(-0.9, -0.6, 3.2),\n            Vector3::new(-0.3, -0.5, 4.1),\n            Vector3::new(0.4, -0.4, 5.0),\n            Vector3::new(0.9, -0.2, 3.7),\n            Vector3::new(-0.8, 0.3, 4.5),\n            Vector3::new(-0.1, 0.6, 3.5),\n            Vector3::new(0.5, 0.5, 5.3),\n            Vector3::new(1.0, 0.2, 4.0),\n        ];\n\n        points\n            .into_iter()\n            .enumerate()\n            .map(|(index, point)| Correspondence {\n                source_feature_index: index,\n                descriptor_distance: 0.0,\n                x1: project(point, Matrix3::identity(), Vector3::zeros()),\n                x2: project(point, rotation, translation),\n            })\n            .collect()\n    }\n\n    #[test]\n    fn eight_point_fit_keeps_the_full_right_null_space() {\n        let yaw = 0.06f64;\n        let rotation = Matrix3::new(\n            yaw.cos(),\n            0.0,\n            yaw.sin(),\n            0.0,\n            1.0,\n            0.0,\n            -yaw.sin(),\n            0.0,\n            yaw.cos(),\n        );\n        let correspondences =\n            exact_correspondences(rotation, Vector3::new(-0.7, 0.04, 0.03));\n        let indices: Vec<usize> = (0..8).collect();\n        let essential =\n            estimate_essential(&correspondences, &indices).expect("essential matrix");\n\n        let max_error = correspondences\n            .iter()\n            .map(|correspondence| sampson_error(&essential, correspondence))\n            .fold(0.0, f64::max);\n        assert!(max_error < 1.0e-8, "maximum Sampson error: {max_error}");\n    }\n\n    #[test]\n    fn triangulates_known_two_view_point() {'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one test marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, tests, 1))
          PY
          cargo fmt --all
      - name: Test geometry kernel
        run: cargo test -p video-to-3d-core
      - name: Lint geometry kernel
        run: cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit mathematical fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-eight-point-nullspace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video-to-3d-core/src/two_view.rs .github/workflows/fix-eight-point-nullspace.yml
          git commit -m "Fix minimal eight-point null-space fit"
          git push origin HEAD:feat/calibrated-two-view-sfm
