name: Fix eight-point null space

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Fix minimal eight-point SVD and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/video-to-3d-core/src/two_view.rs')
          text = path.read_text()

          design = '    let mut design = DMatrix::<f64>::zeros(indices.len(), 9);'
          replacement = '''    // nalgebra computes a thin SVD for rectangular matrices. For the minimal
              // eight-point fit, an 8x9 design matrix would therefore expose only eight
              // right-singular vectors and omit the one-dimensional null space that is the
              // actual essential-matrix solution. A zero row preserves the linear system
              // while making the minimal design square so V^T contains all nine vectors.
              let mut design = DMatrix::<f64>::zeros(indices.len().max(9), 9);'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          if text.count(design) != 1:
              raise SystemExit(f'expected one design matrix marker, found {text.count(design)}')
          text = text.replace(design, replacement, 1)

          marker = '    #[test]\n    fn triangulates_known_two_view_point() {'
          tests = '''    fn exact_correspondences(
              rotation: Matrix3<f64>,
              translation: Vector3<f64>,
          ) -> Vec<Correspondence> {
              let points = [
                  Vector3::new(-0.9, -0.6, 3.2),
                  Vector3::new(-0.3, -0.5, 4.1),
                  Vector3::new(0.4, -0.4, 5.0),
                  Vector3::new(0.9, -0.2, 3.7),
                  Vector3::new(-0.8, 0.3, 4.5),
                  Vector3::new(-0.1, 0.6, 3.5),
                  Vector3::new(0.5, 0.5, 5.3),
                  Vector3::new(1.0, 0.2, 4.0),
              ];

              points
                  .into_iter()
                  .enumerate()
                  .map(|(index, point)| Correspondence {
                      source_feature_index: index,
                      descriptor_distance: 0.0,
                      x1: project(point, Matrix3::identity(), Vector3::zeros()),
                      x2: project(point, rotation, translation),
                  })
                  .collect()
          }

          #[test]
          fn eight_point_fit_keeps_the_full_right_null_space() {
              let yaw = 0.06f64;
              let rotation = Matrix3::new(
                  yaw.cos(),
                  0.0,
                  yaw.sin(),
                  0.0,
                  1.0,
                  0.0,
                  -yaw.sin(),
                  0.0,
                  yaw.cos(),
              );
              let correspondences =
                  exact_correspondences(rotation, Vector3::new(-0.7, 0.04, 0.03));
              let indices: Vec<usize> = (0..8).collect();
              let essential =
                  estimate_essential(&correspondences, &indices).expect("essential matrix");

              let max_error = correspondences
                  .iter()
                  .map(|correspondence| sampson_error(&essential, correspondence))
                  .fold(0.0, f64::max);
              assert!(max_error < 1.0e-8, "maximum Sampson error: {max_error}");
          }

          #[test]
          fn triangulates_known_two_view_point() {'''
          tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in tests.splitlines())
          if text.count(marker) != 1:
              raise SystemExit(f'expected one test marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, tests, 1))
          PY
          cargo fmt --all
      - name: Test geometry kernel
        run: cargo test -p video-to-3d-core
      - name: Lint geometry kernel
        run: cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit mathematical fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-eight-point-nullspace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video-to-3d-core/src/two_view.rs .github/workflows/fix-eight-point-nullspace.yml
          git commit -m "Fix minimal eight-point null-space fit"
          git push origin HEAD:feat/calibrated-two-view-sfm
