name: Diagnose calibrated two-view rejection

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply null-space fix and diagnostics in working tree
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/video-to-3d-core/src/two_view.rs")
          text = path.read_text()

          design_old = "    let mut design = DMatrix::<f64>::zeros(indices.len(), 9);"
          design_new = "    let mut design = DMatrix::<f64>::zeros(indices.len().max(9), 9);"
          if text.count(design_old) != 1:
              raise SystemExit("design marker mismatch")
          text = text.replace(design_old, design_new, 1)

          ratio_old = "    let inlier_ratio = best_inliers.len() as f64 / correspondences.len() as f64;"
          ratio_new = ratio_old + "\n    eprintln!(\"diag best_inliers={} ratio={:.4} median_sampson_norm={:.8}\", best_inliers.len(), inlier_ratio, best_median_error);"
          if text.count(ratio_old) != 1:
              raise SystemExit("ratio marker mismatch")
          text = text.replace(ratio_old, ratio_new, 1)

          rotation_old = "    if rotation_only_residual_pixels(&correspondences, &best_inliers, focal_pixels)?"
          rotation_new = "    eprintln!(\"diag rotation_residual_pixels={:?}\", rotation_only_residual_pixels(&correspondences, &best_inliers, focal_pixels));\n" + rotation_old
          if text.count(rotation_old) != 1:
              raise SystemExit("rotation marker mismatch")
          text = text.replace(rotation_old, rotation_new, 1)

          pose_old = "    let pose = recover_pose(&essential, &correspondences, &best_inliers, focal_pixels)?;"
          pose_new = "    let pose = recover_pose(&essential, &correspondences, &best_inliers, focal_pixels);\n    eprintln!(\"diag recover_pose_present={}\", pose.is_some());\n    let pose = pose?;"
          if text.count(pose_old) != 1:
              raise SystemExit("pose marker mismatch")
          text = text.replace(pose_old, pose_new, 1)

          cheirality_old = "    let required_cheirality = (inliers.len() * 3 / 5).max(8);"
          cheirality_new = cheirality_old + "\n    eprintln!(\"diag pose_points={} required_cheirality={} reprojection={:.6} angle={:.6}\", best.points.len(), required_cheirality, best.median_reprojection_error_pixels, best.median_triangulation_angle_degrees);"
          if text.count(cheirality_old) != 1:
              raise SystemExit("cheirality marker mismatch")
          text = text.replace(cheirality_old, cheirality_new, 1)

          path.write_text(text)
      - name: Run translating fixture with diagnostics
        run: cargo test -p video-to-3d-core two_view::tests::recovers_translating_two_view_fixture_with_outliers -- --nocapture
