name: Finalize calibrated two-view geometry

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply reviewed estimator fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("crates/video-to-3d-core/src/two_view.rs")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"{label} marker mismatch: {text.count(old)}")
              text = text.replace(old, new, 1)

          replace_once(
              '''const RANSAC_ITERATIONS: usize = 96;
          const SAMPSON_THRESHOLD_PIXELS: f64 = 1.75;
          const MIN_INLIER_RATIO: f64 = 0.35;''',
              '''const RANSAC_SAMPLE_SIZE: usize = 8;
          const RANSAC_TARGET_CONFIDENCE: f64 = 0.99;
          const SAMPSON_THRESHOLD_PIXELS: f64 = 1.75;
          const MIN_INLIER_RATIO: f64 = 0.5;''',
              "RANSAC constants",
          )

          loop_replacement = '''    let mut best_inliers = Vec::new();
          let mut best_median_error = f64::INFINITY;
          let mut best_essential = None;
          let mut iteration = 0;
          let mut iteration_limit = required_ransac_iterations(MIN_INLIER_RATIO);

          while iteration < iteration_limit {
              let sample = deterministic_sample(correspondences.len(), iteration);
              iteration += 1;
              let Some(essential) = estimate_essential(&correspondences, &sample) else {
                  continue;
              };
              let mut inliers = Vec::new();
              let mut errors = Vec::new();
              for (index, correspondence) in correspondences.iter().enumerate() {
                  let error = sampson_error(&essential, correspondence);
                  if error.is_finite() && error <= threshold {
                      inliers.push(index);
                      errors.push(error);
                  }
              }

              let median_error = median_f64(&mut errors);
              if inliers.len() > best_inliers.len()
                  || (inliers.len() == best_inliers.len() && median_error < best_median_error)
              {
                  best_inliers = inliers;
                  best_median_error = median_error;
                  best_essential = Some(essential);

                  let observed_inlier_ratio =
                      best_inliers.len() as f64 / correspondences.len() as f64;
                  if observed_inlier_ratio >= MIN_INLIER_RATIO {
                      iteration_limit = iteration_limit.min(
                          required_ransac_iterations(observed_inlier_ratio).max(iteration),
                      );
                  }
              }
          }

          let inlier_ratio ='''
          pattern = re.compile(
              r"    let mut best_inliers = Vec::new\(\);\n"
              r"    let mut best_median_error = f64::INFINITY;\n\n"
              r"    for iteration in 0\.\.RANSAC_ITERATIONS \{\n.*?\n"
              r"    \}\n\n"
              r"    let inlier_ratio =",
              re.DOTALL,
          )
          text, count = pattern.subn(loop_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"RANSAC loop marker mismatch: {count}")

          replace_once(
              '''    let essential = estimate_essential(&correspondences, &best_inliers)?;''',
              '''    // Preserve the robust RANSAC hypothesis. Re-solving the linear eight-point
              // system over rounded pixel inliers can move a good essential model away from the
              // epipolar optimum when the equal-singular-value constraint is re-applied.
              let essential = best_essential?;''',
              "robust essential",
          )

          helper_marker = "fn deterministic_sample(len: usize, iteration: usize) -> Vec<usize> {"
          helper = '''fn required_ransac_iterations(inlier_ratio: f64) -> usize {
              if !inlier_ratio.is_finite() || inlier_ratio <= 0.0 {
                  return usize::MAX;
              }

              let inlier_ratio = inlier_ratio.min(1.0);
              let sample_success = inlier_ratio.powi(RANSAC_SAMPLE_SIZE as i32);
              if sample_success >= 1.0 {
                  return 1;
              }

              let denominator = (1.0 - sample_success).ln();
              if denominator == 0.0 {
                  return usize::MAX;
              }

              let iterations = ((1.0 - RANSAC_TARGET_CONFIDENCE).ln() / denominator).ceil();
              if iterations.is_finite() {
                  iterations.max(1.0) as usize
              } else {
                  usize::MAX
              }
          }

          fn deterministic_sample(len: usize, iteration: usize) -> Vec<usize> {'''
          replace_once(helper_marker, helper, "RANSAC helper")

          replace_once(
              "    let mut design = DMatrix::<f64>::zeros(indices.len(), 9);",
              '''    // nalgebra computes a thin SVD for rectangular matrices. The minimal 8x9
              // design would therefore omit the ninth right-singular vector: exactly the
              // one-dimensional null space required by the eight-point algorithm. Padding with
              // one zero row preserves the linear system and makes the minimum fit square.
              let mut design = DMatrix::<f64>::zeros(indices.len().max(9), 9);''',
              "eight-point design",
          )

          text = text.replace("matches.len() < 8", "matches.len() < RANSAC_SAMPLE_SIZE", 1)
          text = text.replace("indices.len() < 8", "indices.len() < RANSAC_SAMPLE_SIZE", 1)
          text = text.replace("if len == 8 {\n        return (0..8).collect();", "if len == RANSAC_SAMPLE_SIZE {\n        return (0..RANSAC_SAMPLE_SIZE).collect();", 1)
          text = text.replace("Vec::with_capacity(8)", "Vec::with_capacity(RANSAC_SAMPLE_SIZE)", 1)
          text = text.replace("while sample.len() < 8", "while sample.len() < RANSAC_SAMPLE_SIZE", 1)

          test_marker = '''    #[test]
              fn triangulates_known_two_view_point() {'''
          tests = '''    fn exact_correspondences(
                  rotation: Matrix3<f64>,
                  translation: Vector3<f64>,
              ) -> Vec<Correspondence> {
                  let points = [
                      Vector3::new(-0.9, -0.6, 3.2),
                      Vector3::new(-0.3, -0.5, 4.1),
                      Vector3::new(0.4, -0.4, 5.0),
                      Vector3::new(0.9, -0.2, 3.7),
                      Vector3::new(-0.8, 0.3, 4.5),
                      Vector3::new(-0.1, 0.6, 3.5),
                      Vector3::new(0.5, 0.5, 5.3),
                      Vector3::new(1.0, 0.2, 4.0),
                  ];

                  points
                      .into_iter()
                      .enumerate()
                      .map(|(index, point)| Correspondence {
                          source_feature_index: index,
                          descriptor_distance: 0.0,
                          x1: project(point, Matrix3::identity(), Vector3::zeros()),
                          x2: project(point, rotation, translation),
                      })
                      .collect()
              }

              #[test]
              fn eight_point_fit_keeps_the_full_right_null_space() {
                  let yaw = 0.06f64;
                  let rotation = Matrix3::new(
                      yaw.cos(),
                      0.0,
                      yaw.sin(),
                      0.0,
                      1.0,
                      0.0,
                      -yaw.sin(),
                      0.0,
                      yaw.cos(),
                  );
                  let correspondences =
                      exact_correspondences(rotation, Vector3::new(-0.7, 0.04, 0.03));
                  let indices: Vec<usize> = (0..RANSAC_SAMPLE_SIZE).collect();
                  let essential =
                      estimate_essential(&correspondences, &indices).expect("essential matrix");

                  let max_error = correspondences
                      .iter()
                      .map(|correspondence| sampson_error(&essential, correspondence))
                      .fold(0.0, f64::max);
                  assert!(max_error < 1.0e-8, "maximum Sampson error: {max_error}");
              }

              #[test]
              fn ransac_budget_meets_the_minimum_inlier_confidence_contract() {
                  let iterations = required_ransac_iterations(MIN_INLIER_RATIO);
                  let sample_success = MIN_INLIER_RATIO.powi(RANSAC_SAMPLE_SIZE as i32);
                  let achieved_confidence =
                      1.0 - (1.0 - sample_success).powi(iterations as i32);
                  let legacy_confidence = 1.0 - (1.0 - sample_success).powi(96);

                  assert!(achieved_confidence >= RANSAC_TARGET_CONFIDENCE);
                  assert!(legacy_confidence < RANSAC_TARGET_CONFIDENCE);
                  assert!(required_ransac_iterations(0.7) < iterations);
              }

              #[test]
              fn triangulates_known_two_view_point() {'''
          replace_once(test_marker, tests, "regression tests")

          path.write_text(text)

          roadmap = Path("ROADMAP.md")
          roadmap_text = roadmap.read_text()
          roadmap_text = roadmap_text.replace(
              "- Refit on epipolar inliers and expose Sampson-error evidence.",
              "- Retain the strongest robust essential hypothesis and expose Sampson-error evidence.",
              1,
          )
          roadmap.write_text(roadmap_text)
      - name: Format Rust
        run: cargo fmt --all
      - name: Test workspace
        run: cargo test --workspace
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified estimator fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Fix calibrated two-view robust estimation"
          git push origin HEAD:feat/calibrated-two-view-sfm
