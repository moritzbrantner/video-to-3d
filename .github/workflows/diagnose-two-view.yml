name: Finalize calibrated two-view geometry

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply reviewed estimator fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/video-to-3d-core/src/two_view.rs")
          lines = path.read_text().splitlines()

          def unique_index(value):
              matches = [index for index, line in enumerate(lines) if line == value]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {value!r}, found {len(matches)}")
              return matches[0]

          best_error = unique_index("    let mut best_median_error = f64::INFINITY;")
          lines.insert(best_error + 1, "    let mut best_essential = None;")

          winner = unique_index("            best_median_error = median_error;")
          lines.insert(winner + 1, "            best_essential = Some(essential);")

          model_start = unique_index(
              "    let essential = estimate_essential(&correspondences, &best_inliers)?;"
          )
          pose_line = unique_index(
              "    let pose = recover_pose(&essential, &correspondences, &best_inliers, focal_pixels)?;"
          )
          lines[model_start : pose_line + 1] = [
              "    // Keep the robust winning RANSAC hypothesis available. A consensus refit can",
              "    // improve the geometry, but rounded pixel correspondences can also make the",
              "    // constrained refit worse than the robust seed. Only select a refit that survives",
              "    // the same cheirality, reprojection, and triangulation-angle gates.",
              "    let ransac_essential = best_essential?;",
              "    let ransac_pose = recover_pose(",
              "        &ransac_essential,",
              "        &correspondences,",
              "        &best_inliers,",
              "        focal_pixels,",
              "    );",
              "    let refined_model = estimate_essential(&correspondences, &best_inliers).and_then(",
              "        |refined_essential| {",
              "            recover_pose(",
              "                &refined_essential,",
              "                &correspondences,",
              "                &best_inliers,",
              "                focal_pixels,",
              "            )",
              "            .map(|pose| (refined_essential, pose))",
              "        },",
              "    );",
              "",
              "    let (essential, pose) = match (refined_model, ransac_pose) {",
              "        (Some((refined_essential, refined_pose)), Some(ransac_pose)) => {",
              "            let refined_is_better = refined_pose.points.len() > ransac_pose.points.len()",
              "                || (refined_pose.points.len() == ransac_pose.points.len()",
              "                    && refined_pose.median_reprojection_error_pixels",
              "                        < ransac_pose.median_reprojection_error_pixels);",
              "            if refined_is_better {",
              "                (refined_essential, refined_pose)",
              "            } else {",
              "                (ransac_essential, ransac_pose)",
              "            }",
              "        }",
              "        (Some(refined_model), None) => refined_model,",
              "        (None, Some(ransac_pose)) => (ransac_essential, ransac_pose),",
              "        (None, None) => return None,",
              "    };",
              "",
              "    let mut sampson_errors_pixels: Vec<f64> = best_inliers",
              "        .iter()",
              "        .map(|&index| {",
              "            sampson_error(&essential, &correspondences[index]).sqrt() * focal_pixels",
              "        })",
              "        .filter(|error| error.is_finite())",
              "        .collect();",
              "    let median_sampson_error_pixels = median_f64(&mut sampson_errors_pixels);",
          ]

          design = unique_index("    let mut design = DMatrix::<f64>::zeros(indices.len(), 9);")
          lines[design : design + 1] = [
              "    // nalgebra computes a thin SVD for rectangular matrices. The minimal 8x9",
              "    // design omits the ninth right-singular vector: exactly the one-dimensional",
              "    // null space required by the eight-point algorithm. A zero row preserves the",
              "    // homogeneous system while making the minimal fit square.",
              "    let mut design = DMatrix::<f64>::zeros(indices.len().max(9), 9);",
          ]

          marker = unique_index("    fn triangulates_known_two_view_point() {")
          if marker == 0 or lines[marker - 1] != "    #[test]":
              raise SystemExit("triangulation test marker malformed")
          insert_at = marker - 1
          regression = [
              "    fn exact_correspondences(",
              "        rotation: Matrix3<f64>,",
              "        translation: Vector3<f64>,",
              "    ) -> Vec<Correspondence> {",
              "        let points = [",
              "            Vector3::new(-0.9, -0.6, 3.2),",
              "            Vector3::new(-0.3, -0.5, 4.1),",
              "            Vector3::new(0.4, -0.4, 5.0),",
              "            Vector3::new(0.9, -0.2, 3.7),",
              "            Vector3::new(-0.8, 0.3, 4.5),",
              "            Vector3::new(-0.1, 0.6, 3.5),",
              "            Vector3::new(0.5, 0.5, 5.3),",
              "            Vector3::new(1.0, 0.2, 4.0),",
              "        ];",
              "",
              "        points",
              "            .into_iter()",
              "            .enumerate()",
              "            .map(|(index, point)| Correspondence {",
              "                source_feature_index: index,",
              "                descriptor_distance: 0.0,",
              "                x1: project(point, Matrix3::identity(), Vector3::zeros()),",
              "                x2: project(point, rotation, translation),",
              "            })",
              "            .collect()",
              "    }",
              "",
              "    #[test]",
              "    fn eight_point_fit_keeps_the_full_right_null_space() {",
              "        let yaw = 0.06f64;",
              "        let rotation = Matrix3::new(",
              "            yaw.cos(),",
              "            0.0,",
              "            yaw.sin(),",
              "            0.0,",
              "            1.0,",
              "            0.0,",
              "            -yaw.sin(),",
              "            0.0,",
              "            yaw.cos(),",
              "        );",
              "        let correspondences =",
              "            exact_correspondences(rotation, Vector3::new(-0.7, 0.04, 0.03));",
              "        let indices: Vec<usize> = (0..8).collect();",
              "        let essential =",
              "            estimate_essential(&correspondences, &indices).expect(\"essential matrix\");",
              "",
              "        let max_error = correspondences",
              "            .iter()",
              "            .map(|correspondence| sampson_error(&essential, correspondence))",
              "            .fold(0.0, f64::max);",
              "        assert!(max_error < 1.0e-8, \"maximum Sampson error: {max_error}\");",
              "    }",
              "",
          ]
          lines[insert_at:insert_at] = regression

          path.write_text("\n".join(lines) + "\n")
      - name: Format Rust
        run: cargo fmt --all
      - name: Test reconstruction core
        run: cargo test -p video-to-3d-core
      - name: Lint reconstruction core
        run: cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit verified estimator fixes
        shell: bash
        run: |
          rm -f \
            .github/workflows/diagnose-two-view.yml \
            .github/workflows/finalize-two-view-with-deps.yml \
            .github/workflows/finalize-two-view.yml \
            .github/workflows/fix-eight-point-nullspace.yml \
            .github/workflows/refine-pr-2.yml \
            .github/workflows/format-pr-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix calibrated two-view robust estimation"
          git push origin HEAD:feat/calibrated-two-view-sfm
