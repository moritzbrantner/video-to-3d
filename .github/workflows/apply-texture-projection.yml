name: Apply texture projection patch

on:
  push:
    branches: [feature/texture-projection]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply texture projection patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feature/texture-projection
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install
      - name: Apply bounded texture projection slice
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}: found {count}\n{old[:160]}")
              path.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              path = Path(path)
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected exactly one regex match in {path}: found {count}\n{pattern}")
              path.write_text(updated)

          Path("apps/web/src/meshTexture.ts").write_text(r'''export type Point2 = {
            x: number;
            y: number;
          };

          export type DenseReferencePatchRanges = {
            reference_frame: number;
            primary_start: number;
            primary_points: number;
            completion_start: number;
            completed_points: number;
          };

          const UNASSIGNED_REFERENCE = -1;
          const AMBIGUOUS_REFERENCE = -2;

          export function buildDensePointReferenceFrames(
            pointCount: number,
            patches: DenseReferencePatchRanges[],
          ): Int32Array {
            const references = new Int32Array(pointCount);
            references.fill(UNASSIGNED_REFERENCE);

            const assignRange = (start: number, count: number, referenceFrame: number) => {
              if (
                !Number.isSafeInteger(start) ||
                !Number.isSafeInteger(count) ||
                !Number.isSafeInteger(referenceFrame) ||
                start < 0 ||
                count < 0 ||
                referenceFrame < 0
              ) {
                return;
              }
              const end = Math.min(pointCount, start + count);
              for (let index = start; index < end; index += 1) {
                const current = references[index];
                if (current === UNASSIGNED_REFERENCE) {
                  references[index] = referenceFrame;
                } else if (current !== referenceFrame) {
                  references[index] = AMBIGUOUS_REFERENCE;
                }
              }
            };

            for (const patch of patches) {
              assignRange(patch.primary_start, patch.primary_points, patch.reference_frame);
              assignRange(patch.completion_start, patch.completed_points, patch.reference_frame);
            }
            return references;
          }

          export function triangleTextureReference(
            a: number,
            b: number,
            c: number,
            references: Int32Array,
          ): number | null {
            if (
              !Number.isSafeInteger(a) ||
              !Number.isSafeInteger(b) ||
              !Number.isSafeInteger(c) ||
              a < 0 ||
              b < 0 ||
              c < 0 ||
              a >= references.length ||
              b >= references.length ||
              c >= references.length
            ) {
              return null;
            }
            const reference = references[a];
            if (reference < 0 || references[b] !== reference || references[c] !== reference) {
              return null;
            }
            return reference;
          }

          export function affineTriangleTransform(
            source: [Point2, Point2, Point2],
            destination: [Point2, Point2, Point2],
          ): [number, number, number, number, number, number] | null {
            const [s0, s1, s2] = source;
            const [d0, d1, d2] = destination;
            const denominator =
              s0.x * (s1.y - s2.y) +
              s1.x * (s2.y - s0.y) +
              s2.x * (s0.y - s1.y);
            if (!Number.isFinite(denominator) || Math.abs(denominator) < 1e-9) return null;

            const a =
              (d0.x * (s1.y - s2.y) +
                d1.x * (s2.y - s0.y) +
                d2.x * (s0.y - s1.y)) /
              denominator;
            const c =
              (d0.x * (s2.x - s1.x) +
                d1.x * (s0.x - s2.x) +
                d2.x * (s1.x - s0.x)) /
              denominator;
            const e =
              (d0.x * (s1.x * s2.y - s2.x * s1.y) +
                d1.x * (s2.x * s0.y - s0.x * s2.y) +
                d2.x * (s0.x * s1.y - s1.x * s0.y)) /
              denominator;
            const b =
              (d0.y * (s1.y - s2.y) +
                d1.y * (s2.y - s0.y) +
                d2.y * (s0.y - s1.y)) /
              denominator;
            const d =
              (d0.y * (s2.x - s1.x) +
                d1.y * (s0.x - s2.x) +
                d2.y * (s1.x - s0.x)) /
              denominator;
            const f =
              (d0.y * (s1.x * s2.y - s2.x * s1.y) +
                d1.y * (s2.x * s0.y - s0.x * s2.y) +
                d2.y * (s0.x * s1.y - s1.x * s0.y)) /
              denominator;
            const transform = [a, b, c, d, e, f] as const;
            return transform.every(Number.isFinite) ? [...transform] : null;
          }
          '''.replace("          ", ""))

          Path("scripts/test-texture-projection.ts").write_text(r'''import {
            affineTriangleTransform,
            buildDensePointReferenceFrames,
            triangleTextureReference,
            type Point2,
          } from "../apps/web/src/meshTexture";

          function assert(condition: unknown, message: string): asserts condition {
            if (!condition) throw new Error(message);
          }

          function approximatelyEqual(left: number, right: number, epsilon = 1e-6): boolean {
            return Math.abs(left - right) <= epsilon;
          }

          function applyTransform(
            transform: [number, number, number, number, number, number],
            point: Point2,
          ): Point2 {
            const [a, b, c, d, e, f] = transform;
            return {
              x: a * point.x + c * point.y + e,
              y: b * point.x + d * point.y + f,
            };
          }

          const references = buildDensePointReferenceFrames(8, [
            {
              reference_frame: 2,
              primary_start: 0,
              primary_points: 3,
              completion_start: 6,
              completed_points: 1,
            },
            {
              reference_frame: 5,
              primary_start: 3,
              primary_points: 3,
              completion_start: 7,
              completed_points: 1,
            },
          ]);
          assert(references[0] === 2 && references[2] === 2 && references[6] === 2, "first reference ranges were not preserved");
          assert(references[3] === 5 && references[5] === 5 && references[7] === 5, "second reference ranges were not preserved");
          assert(triangleTextureReference(0, 1, 2, references) === 2, "single-reference triangle should be texture eligible");
          assert(triangleTextureReference(1, 2, 3, references) === null, "mixed-reference triangle must fail closed");

          const ambiguous = buildDensePointReferenceFrames(3, [
            { reference_frame: 1, primary_start: 0, primary_points: 2, completion_start: 2, completed_points: 0 },
            { reference_frame: 4, primary_start: 1, primary_points: 2, completion_start: 3, completed_points: 0 },
          ]);
          assert(ambiguous[1] < 0, "overlapping references must become ambiguous");
          assert(triangleTextureReference(0, 1, 2, ambiguous) === null, "ambiguous range must never select a texture");

          const source: [Point2, Point2, Point2] = [
            { x: 2, y: 3 },
            { x: 8, y: 4 },
            { x: 4, y: 11 },
          ];
          const destination: [Point2, Point2, Point2] = [
            { x: 20, y: 30 },
            { x: 70, y: 35 },
            { x: 32, y: 90 },
          ];
          const transform = affineTriangleTransform(source, destination);
          assert(transform !== null, "non-degenerate source triangle should produce an affine transform");
          source.forEach((point, index) => {
            const mapped = applyTransform(transform, point);
            assert(approximatelyEqual(mapped.x, destination[index].x), `affine transform x mismatch at vertex ${index}`);
            assert(approximatelyEqual(mapped.y, destination[index].y), `affine transform y mismatch at vertex ${index}`);
          });
          assert(
            affineTriangleTransform(
              [{ x: 0, y: 0 }, { x: 1, y: 1 }, { x: 2, y: 2 }],
              destination,
            ) === null,
            "degenerate texture triangle must fail closed",
          );

          console.log("texture projection contract passed");
          '''.replace("          ", ""))

