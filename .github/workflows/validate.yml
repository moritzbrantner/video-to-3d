name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    outputs:
      allow-skipped: ${{ steps.merge-scope.outputs.allow-skipped }}
      validate-runtime-evidence: ${{ steps.merge-scope.outputs.validate-runtime-evidence }}
      validate-pages-build: ${{ steps.merge-scope.outputs.validate-pages-build }}
      validate-blender-acceptance: ${{ steps.merge-scope.outputs.validate-blender-acceptance }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine required PR validation scope
        id: merge-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          filters = {'validate-runtime-evidence': {'paths': ['.github/workflows/runtime-evidence.yml', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain*', 'crates/video-to-3d-core/**', 'crates/video-to-3d-feature-wasm/**', 'profiles/runtime-profiler/**', 'tools/**', 'scripts/**'], 'branches': ['main']}, 'validate-pages-build': {'paths': None, 'branches': None}, 'validate-blender-acceptance': {'paths': ['tools/blender/**', 'crates/video-to-3d-core/examples/synthetic_room_fixture.rs', '.github/workflows/blender-acceptance.yml'], 'branches': ['main']}}
          def matches(path, pattern):
              pattern = re.escape(pattern).replace(r"\*\*", ".*").replace(r"\*", "[^/]*").replace(r"\?", "[^/]")
              return re.fullmatch(pattern, path) is not None
          skipped = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, scope in filters.items():
                  matches_paths = scope["paths"] is None or any(matches(path, pattern) for path in paths if path for pattern in scope["paths"])
                  matches_branch = scope["branches"] is None or any(matches(os.environ["BASE_BRANCH"], pattern) for pattern in scope["branches"])
                  required = matches_paths and matches_branch
                  print(f"{name}={str(required).lower()}", file=output)
                  if not required:
                      skipped.append(name)
              print("allow-skipped=" + json.dumps(skipped), file=output)
          PYTHON
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Install verified wasm-bindgen CLI
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-bindgen
          version: "0.2.129"
      - run: bun run typecheck
      - name: Build-script target acceptance (#192)
        run: bun test scripts/build-wasm.acceptance.test.ts
      - run: bun run test:learned-provider-contract
      - run: bun run test:texture-projection
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate feature-pipeline experiment
        run: |
          cargo fmt --manifest-path crates/video-to-3d-feature-wasm/Cargo.toml --check
          cargo check --manifest-path crates/video-to-3d-feature-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Test golden pose alignment, reference fixture and synthetic scene truth
        run: |
          cargo test -p video-to-3d-core --example golden_fixture
          cargo test -p video-to-3d-core --example reference_fixture
          cargo test -p video-to-3d-core --example synthetic_room_fixture
      - name: Test benchmark and COLMAP tooling
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m py_compile tools/fetch_tanks_and_temples.py tools/score_tanks_and_temples.py
      - run: bun run wasm:check
      - run: bun run build
      - name: Test Rust to WASM to TypeScript camera-state contract
        run: bun run test:browser-contract
      - name: Benchmark TypeScript to WASM reconstruction boundary
        run: bun run benchmark:wasm-boundary
      - name: Test browser and benchmark video-sampling contract
        run: bun run test:video-sampling-contract

  validate-runtime-evidence:
    needs: validate
    if: github.event_name == 'pull_request' && needs.validate.outputs.validate-runtime-evidence == 'true'
    uses: ./.github/workflows/runtime-evidence.yml
    permissions:
      contents: read

  validate-pages-build:
    needs: validate
    if: github.event_name == 'pull_request' && needs.validate.outputs.validate-pages-build == 'true'
    uses: ./.github/workflows/pages-build.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  validate-blender-acceptance:
    needs: validate
    if: github.event_name == 'pull_request' && needs.validate.outputs.validate-blender-acceptance == 'true'
    uses: ./.github/workflows/blender-acceptance.yml
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: ["validate", "validate-runtime-evidence", "validate-pages-build", "validate-blender-acceptance"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validate", "validate-runtime-evidence", "validate-pages-build", "validate-blender-acceptance"]'
          allow-skipped: ${{ needs.validate.outputs.allow-skipped || '[]' }}
