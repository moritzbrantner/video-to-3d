name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: bun run typecheck
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate feature-pipeline experiment
        run: |
          cargo fmt --manifest-path crates/video-to-3d-features/Cargo.toml
          cargo clippy --manifest-path crates/video-to-3d-features/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/video-to-3d-features/Cargo.toml
          cargo fmt --manifest-path crates/video-to-3d-feature-wasm/Cargo.toml
          cargo check --manifest-path crates/video-to-3d-feature-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Commit rustfmt output once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- crates/video-to-3d-features/src/lib.rs crates/video-to-3d-feature-wasm/src/lib.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/video-to-3d-features/src/lib.rs crates/video-to-3d-feature-wasm/src/lib.rs
            git commit -m "Format feature pipeline sources"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Test golden pose alignment
        run: cargo test -p video-to-3d-core --example golden_fixture
      - name: Test benchmark and COLMAP tooling
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m py_compile tools/fetch_tanks_and_temples.py tools/score_tanks_and_temples.py
      - run: bun run wasm:check
      - run: bun run build
      - name: Test Rust to WASM to TypeScript camera-state contract
        run: bun run test:browser-contract
      - name: Benchmark TypeScript to WASM reconstruction boundary
        run: bun run benchmark:wasm-boundary
      - name: Test browser and benchmark video-sampling contract
        run: bun run test:video-sampling-contract
