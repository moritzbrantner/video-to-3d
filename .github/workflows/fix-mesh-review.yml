name: Fix mesh review findings

on:
  push:
    branches:
      - feat/dense-mesh-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/dense-mesh-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply mesh review fixes
        run: python scripts/fix_mesh_review.py
      - name: Validate mesh review fixes
        run: |
          cargo fmt --all
          cargo test -p video-to-3d-core
          cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit fixes and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/fix-mesh-review.yml
          rm scripts/fix_mesh_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve dense grid identity for mesh topology"
          git push origin HEAD:feat/dense-mesh-foundation
