name: Repair texture formatting

on:
  push:
    branches:
      - feature/texture-projection

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Retry texture formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feature/texture-projection
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Repair formatting
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("apps/web/src/SceneCanvas.tsx")
          text = path.read_text()
          hook_pattern = r"  const textureReferenceFrames = useMemo\(\n.*?\nconst \[textureImages, setTextureImages\] = useState<Array<HTMLImageElement \| null>>\(\[\]\);"
          hook = "\n".join([
              "  const textureReferenceFrames = useMemo(",
              "    () =>",
              "      [",
              "        ...new Set(",
              "          reconstruction.dense.reference_patches.map((patch) => patch.reference_frame),",
              "        ),",
              "      ].filter((frameIndex) => textureFrames[frameIndex]),",
              "    [reconstruction.dense.reference_patches, textureFrames],",
              "  );",
              "  const [textureImages, setTextureImages] = useState<Array<HTMLImageElement | null>>([]);",
          ])
          text, hook_count = re.subn(hook_pattern, hook, text, count=1, flags=re.S)
          preload_pattern = r"    const pending = textureReferenceFrames\.flatMap\(\(index\) => \{\n.*?\n  \}\);"
          preload = "\n".join([
              "    const pending = textureReferenceFrames.flatMap((index) => {",
              "      const frame = textureFrames[index];",
              "      if (!frame) return [];",
              "      const image = new Image();",
              "      image.onload = () => {",
              "        if (cancelled) return;",
              "        loaded[index] = image;",
              "        setTextureImages([...loaded]);",
              "      };",
              "      image.src = frame.thumbnail;",
              "      return [image];",
              "    });",
          ])
          text, preload_count = re.subn(preload_pattern, preload, text, count=1, flags=re.S)
          if hook_count != 1 or preload_count != 1:
              raise SystemExit(f"format anchors mismatch: hook={hook_count}, preload={preload_count}")
          path.write_text(text)
          PY
      - run: bun run typecheck
      - run: bun run test:texture-projection
      - name: Commit repaired formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/SceneCanvas.tsx
          git commit -m "Repair texture preload formatting"
          git push