name: Format texture preload implementation

on:
  push:
    branches: [feature/texture-projection]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Format texture preload implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feature/texture-projection
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Format preload block
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/SceneCanvas.tsx')
          text = path.read_text()

          old_hook = '''  const textureReferenceFrames = useMemo(
          () =>
            [...new Set(reconstruction.dense.reference_patches.map((patch) => patch.reference_frame))].filter(
              (frameIndex) => textureFrames[frameIndex],
            ),
          [reconstruction.dense.reference_patches, textureFrames],
        );
        const [textureImages, setTextureImages] = useState<Array<HTMLImageElement | null>>([]);'''.replace('        ', '')
          new_hook = '''  const textureReferenceFrames = useMemo(
            () =>
              [
                ...new Set(
                  reconstruction.dense.reference_patches.map((patch) => patch.reference_frame),
                ),
              ].filter((frameIndex) => textureFrames[frameIndex]),
            [reconstruction.dense.reference_patches, textureFrames],
          );
          const [textureImages, setTextureImages] = useState<Array<HTMLImageElement | null>>([]);'''.replace('          ', '')

          old_preload = '''    const pending = textureReferenceFrames.flatMap((index) => {
          const frame = textureFrames[index];
          if (!frame) return [];
          const image = new Image();
          image.onload = () => {
            if (cancelled) return;
            loaded[index] = image;
            setTextureImages([...loaded]);
          };
          image.src = frame.thumbnail;
          return [image];
        });'''.replace('        ', '')
          new_preload = '''    const pending = textureReferenceFrames.flatMap((index) => {
            const frame = textureFrames[index];
            if (!frame) return [];
            const image = new Image();
            image.onload = () => {
              if (cancelled) return;
              loaded[index] = image;
              setTextureImages([...loaded]);
            };
            image.src = frame.thumbnail;
            return [image];
          });'''.replace('          ', '')

          if text.count(old_hook) != 1:
              raise SystemExit(f'expected one unformatted texture hook, found {text.count(old_hook)}')
          if text.count(old_preload) != 1:
              raise SystemExit(f'expected one unformatted preload block, found {text.count(old_preload)}')
          text = text.replace(old_hook, new_hook, 1).replace(old_preload, new_preload, 1)
          path.write_text(text)
          PY
      - run: bun run typecheck
      - run: bun run test:texture-projection
      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/SceneCanvas.tsx
          git commit -m "Format texture preload implementation"
          git push