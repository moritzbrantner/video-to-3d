name: Fix calibrated two-view RANSAC confidence

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply RANSAC confidence fix
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("crates/video-to-3d-core/src/two_view.rs")
          text = path.read_text()

          old = '''const RANSAC_ITERATIONS: usize = 96;
          const SAMPSON_THRESHOLD_PIXELS: f64 = 1.75;
          const MIN_INLIER_RATIO: f64 = 0.35;'''
          new = '''const RANSAC_SAMPLE_SIZE: usize = 8;
          const RANSAC_TARGET_CONFIDENCE: f64 = 0.99;
          const SAMPSON_THRESHOLD_PIXELS: f64 = 1.75;
          const MIN_INLIER_RATIO: f64 = 0.5;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          loop_pattern = re.compile(
              r'''    for iteration in 0\.\.RANSAC_ITERATIONS \{\n(.*?)\n    \}\n\n    let inlier_ratio =''',
              re.DOTALL,
          )
          match = loop_pattern.search(text)
          assert match is not None
          body = match.group(1)
          body = body.replace(
              '''        let sample = deterministic_sample(correspondences.len(), iteration);''',
              '''        let sample = deterministic_sample(correspondences.len(), iteration);
                  iteration += 1;''',
              1,
          )
          body = body.replace(
              '''            best_essential = Some(essential);''',
              '''            best_essential = Some(essential);

                  let observed_inlier_ratio =
                      best_inliers.len() as f64 / correspondences.len() as f64;
                  if observed_inlier_ratio >= MIN_INLIER_RATIO {
                      iteration_limit = iteration_limit.min(
                          required_ransac_iterations(observed_inlier_ratio).max(iteration),
                      );
                  }''',
              1,
          )
          replacement = '''    let mut iteration = 0;
              let mut iteration_limit = required_ransac_iterations(MIN_INLIER_RATIO);
              while iteration < iteration_limit {
          ''' + body + '''
              }

              let inlier_ratio ='''
          text, count = loop_pattern.subn(replacement, text, count=1)
          assert count == 1

          marker = '''fn deterministic_sample(len: usize, iteration: usize) -> Vec<usize> {'''
          helper = '''fn required_ransac_iterations(inlier_ratio: f64) -> usize {
              if !inlier_ratio.is_finite() || inlier_ratio <= 0.0 {
                  return usize::MAX;
              }

              let inlier_ratio = inlier_ratio.min(1.0);
              let sample_success = inlier_ratio.powi(RANSAC_SAMPLE_SIZE as i32);
              if sample_success >= 1.0 {
                  return 1;
              }

              let denominator = (1.0 - sample_success).ln();
              if denominator == 0.0 {
                  return usize::MAX;
              }

              let iterations = ((1.0 - RANSAC_TARGET_CONFIDENCE).ln() / denominator).ceil();
              if iterations.is_finite() {
                  iterations.max(1.0) as usize
              } else {
                  usize::MAX
              }
          }

          fn deterministic_sample(len: usize, iteration: usize) -> Vec<usize> {'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper, 1)

          text = text.replace("matches.len() < 8", "matches.len() < RANSAC_SAMPLE_SIZE", 1)
          text = text.replace("best_inliers.len() < 8", "best_inliers.len() < RANSAC_SAMPLE_SIZE", 1)
          text = text.replace("indices.len() < 8", "indices.len() < RANSAC_SAMPLE_SIZE", 1)
          text = text.replace(
              "if len == 8 {\n        return (0..8).collect();",
              "if len == RANSAC_SAMPLE_SIZE {\n        return (0..RANSAC_SAMPLE_SIZE).collect();",
              1,
          )
          text = text.replace("Vec::with_capacity(8)", "Vec::with_capacity(RANSAC_SAMPLE_SIZE)", 1)
          text = text.replace("while sample.len() < 8", "while sample.len() < RANSAC_SAMPLE_SIZE", 1)

          test_marker = '''    #[test]
              fn triangulates_known_two_view_point() {'''
          confidence_test = '''    #[test]
              fn ransac_budget_meets_the_minimum_inlier_confidence_contract() {
                  let iterations = required_ransac_iterations(MIN_INLIER_RATIO);
                  let sample_success = MIN_INLIER_RATIO.powi(RANSAC_SAMPLE_SIZE as i32);
                  let achieved_confidence =
                      1.0 - (1.0 - sample_success).powi(iterations as i32);
                  let legacy_confidence = 1.0 - (1.0 - sample_success).powi(96);

                  assert!(achieved_confidence >= RANSAC_TARGET_CONFIDENCE);
                  assert!(legacy_confidence < RANSAC_TARGET_CONFIDENCE);
                  assert!(required_ransac_iterations(0.7) < iterations);
              }

              #[test]
              fn triangulates_known_two_view_point() {'''
          assert text.count(test_marker) == 1
          text = text.replace(test_marker, confidence_test, 1)

          path.write_text(text)
      - name: Format Rust
        run: cargo fmt --all
      - name: Test reconstruction core
        run: cargo test -p video-to-3d-core
      - name: Lint reconstruction core
        run: cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/fix-ransac-confidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix calibrated two-view RANSAC confidence"
          git push origin HEAD:feat/calibrated-two-view-sfm
