name: Real Video Evidence

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Quantitative real-video case id from benchmarks/real-video-corpus.json
        required: true
        type: string
        default: tanks-temples-ignatius
      accept_tanks_and_temples_terms:
        description: I have reviewed and accept the current Tanks and Temples dataset terms for this run
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate real-video corpus manifest
        run: python3 tools/check_real_video_manifest.py

  benchmark:
    needs: validate-corpus
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.accept_tanks_and_temples_terms) ||
      (github.event_name == 'schedule' && vars.TANKS_AND_TEMPLES_TERMS_ACCEPTED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install benchmark acquisition, decode, and scoring tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv .benchmark-venv
          .benchmark-venv/bin/python -m pip install --disable-pip-version-check \
            gdown==5.2.0 \
            numpy==2.5.3 \
            scipy==1.18.1 \
            plyfile==1.1.5
      - name: Run checksum-verified real-video evidence
        env:
          MANUAL_CASE: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          mkdir -p target
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python3 tools/check_real_video_manifest.py --scheduled-cases > target/scheduled-real-video-cases.txt
            mapfile -t cases < target/scheduled-real-video-cases.txt
          else
            cases=("${MANUAL_CASE:-tanks-temples-ignatius}")
          fi

          if [[ ${#cases[@]} -eq 0 ]]; then
            echo "No real-video cases are scheduled in the validated manifest."
            exit 0
          fi

          for case_id in "${cases[@]}"; do
            .benchmark-venv/bin/python tools/fetch_tanks_and_temples.py \
              --case "$case_id" \
              --asset-root .benchmark-data/tanks-and-temples \
              --with-evaluation
            bun tools/run_real_video_case.ts \
              --case "$case_id" \
              --asset-root .benchmark-data \
              --output-root target/real-video
            .benchmark-venv/bin/python tools/score_tanks_and_temples.py \
              --case "$case_id" \
              --asset-root .benchmark-data \
              --output-root target/real-video
          done
      - name: Upload reconstruction evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-video-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            target/real-video/*/sampling.json
            target/real-video/*/metrics.json
            target/real-video/*/ground-truth-score.json
            target/real-video/*/sparse.ply
            target/real-video/*/dense.ply
            target/real-video/*/cameras.csv
