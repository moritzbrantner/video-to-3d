name: Real Video Evidence

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Quantitative real-video case to run
        required: true
        type: choice
        default: tanks-temples-ignatius
        options:
          - tanks-temples-ignatius
          - tanks-temples-church
      accept_tanks_and_temples_terms:
        description: I have reviewed and accept the current Tanks and Temples dataset terms for this run
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate real-video corpus manifest
        run: python3 tools/check_real_video_manifest.py

  benchmark:
    needs: validate-corpus
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.accept_tanks_and_temples_terms) ||
      (github.event_name == 'schedule' && vars.TANKS_AND_TEMPLES_TERMS_ACCEPTED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install benchmark acquisition and decode tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv .benchmark-venv
          .benchmark-venv/bin/python -m pip install --disable-pip-version-check gdown==5.2.0
      - name: Run checksum-verified real-video evidence
        env:
          MANUAL_CASE: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            cases=(tanks-temples-ignatius tanks-temples-church)
          else
            cases=("${MANUAL_CASE:-tanks-temples-ignatius}")
          fi

          for case_id in "${cases[@]}"; do
            case "$case_id" in
              tanks-temples-ignatius) scene=Ignatius ;;
              tanks-temples-church) scene=Church ;;
              *) echo "unsupported scheduled case: $case_id" >&2; exit 1 ;;
            esac
            .benchmark-venv/bin/python tools/fetch_tanks_and_temples.py \
              --scene "$scene" \
              --asset-root .benchmark-data/tanks-and-temples
            bun tools/run_real_video_case.ts \
              --case "$case_id" \
              --asset-root .benchmark-data \
              --output-root target/real-video
          done
      - name: Upload reconstruction evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-video-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            target/real-video/*/sampling.json
            target/real-video/*/metrics.json
            target/real-video/*/sparse.ply
            target/real-video/*/dense.ply
            target/real-video/*/cameras.csv
