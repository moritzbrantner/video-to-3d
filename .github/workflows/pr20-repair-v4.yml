name: Repair PR 20 v4

on:
  push:
    branches:
      - automation/pr20-repair
    paths:
      - .github/workflows/pr20-repair-v4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: automation/pr20-repair
          fetch-depth: 0

      - name: Extract patch script with robust mesh substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr20-repair-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          lines = workflow[start:end]
          deindented = []
          for line in lines:
              if line.startswith('          '):
                  line = line[10:]
              deindented.append(line)
          script = '\n'.join(deindented) + '\n'

          old_helper = '''def regex_one(text: str, pattern: str, repl: str, label: str) -> str:
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return updated
          '''
          new_helper = '''def regex_one(text: str, pattern: str, repl: str, label: str) -> str:
              if label == "mesh rejected-grid field":
                  old = "    pub grid_vertices: usize;"
                  if text.count(old) != 1:
                      raise SystemExit(f"{label}: expected one mesh field, found {text.count(old)}")
                  return text.replace(
                      old,
                      old + "\\n    pub rejected_grid_vertices: usize;",
                      1,
                  )
              if label == "mesh low-survivor stats":
                  old = ''' + '"""' + '''    if grid.len() < 3 {
              return MeshAnalysis::skipped(
                  Some(reference_frame),
                  "fewer than three fused dense points align with the reference sampling grid",
              );
          }
          ''' + '"""' + '''
                  new = ''' + '"""' + '''    if grid.len() < 3 {
              return MeshAnalysis {
                  stats: MeshStats {
                      attempted: true,
                      skip_reason: Some(
                          "fewer than three fused dense points align with the reference sampling grid"
                              .into(),
                      ),
                      reference_frame: Some(reference_frame),
                      grid_vertices: grid.len(),
                      rejected_grid_vertices: dense_points.len().saturating_sub(grid.len()),
                      ..MeshStats::default()
                  },
                  triangles: Vec::new(),
              };
          }
          ''' + '"""' + '''
                  if text.count(old) != 1:
                      raise SystemExit(f"{label}: expected one low-survivor block, found {text.count(old)}")
                  return text.replace(old, new, 1)
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return updated
          '''
          if script.count(old_helper) != 1:
              raise SystemExit('could not replace regex helper in extracted patch script')
          script = script.replace(old_helper, new_helper, 1)
          Path('/tmp/pr20-repair.py').write_text(script)
          PY

      - name: Check out PR branch and apply repair
        shell: bash
        run: |
          git checkout -B feat/dense-mesh-foundation origin/feat/dense-mesh-foundation
          python /tmp/pr20-repair.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p video-to-3d-core
          cargo check -p video-to-3d-wasm

      - name: Commit repaired PR head
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/video-to-3d-core/src/reconstruction.rs crates/video-to-3d-core/src/mesh.rs crates/video-to-3d-wasm/src/lib.rs apps/web/src/reconstruction.ts apps/web/src/SceneCanvas.tsx ROADMAP.md
          git diff --cached --check
          git commit -m "Move recovery into core and preserve mesh admission evidence"
          git push origin HEAD:feat/dense-mesh-foundation
