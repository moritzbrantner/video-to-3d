name: Runtime evidence, COLMAP golden, and Moonlight

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_PROFILER_REV: 8280c95feb2a1075efa0480a9622e40c723e0b3a
  MOONLIGHT_REV: a615843b6497cfa0e746224673592c107d969bda

jobs:
  reconstruction-evidence:
    name: Reconstruction runtime, COLMAP golden, and behavior
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Check out exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          fetch-depth: 0

      - name: Check out pinned Moonlight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/moonlight
          ref: ${{ env.MOONLIGHT_REV }}
          path: moonlight

      - name: Install Rust and COLMAP
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y colmap python3-venv
          colmap -h | head -n 4

      - name: Install exact COLMAP reference matcher
        run: |
          python3 -m venv "$RUNNER_TEMP/colmap-python"
          "$RUNNER_TEMP/colmap-python/bin/pip" install -r candidate/tools/requirements-colmap.txt
          echo "$RUNNER_TEMP/colmap-python/bin" >> "$GITHUB_PATH"

      - name: Install runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler --rev "$RUNTIME_PROFILER_REV" --locked

      - name: Give the base the identical revision workload
        run: |
          mkdir -p reference/crates/video-to-3d-core/examples reference/profiles/runtime-profiler
          cp candidate/crates/video-to-3d-core/examples/profile_reconstruct.rs \
            reference/crates/video-to-3d-core/examples/profile_reconstruct.rs
          cp candidate/profiles/runtime-profiler/reconstruct.json reference/profiles/runtime-profiler/reconstruct.json
          git -C reference add \
            crates/video-to-3d-core/examples/profile_reconstruct.rs \
            profiles/runtime-profiler/reconstruct.json
          if ! git -C reference diff --cached --quiet; then
            git -C reference \
              -c user.name='runtime-profiler' \
              -c user.email='runtime-profiler@invalid' \
              commit -m 'chore: attach comparable reconstruction workload'
          fi

      - name: Prime deterministic workloads
        run: |
          (cd reference && cargo build --locked --release -p video-to-3d-core --example profile_reconstruct)
          (cd candidate && cargo build --locked --release -p video-to-3d-core --example profile_reconstruct --example golden_fixture --example reference_fixture)
          test -z "$(git -C reference status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"

      - name: Capture reference revision evidence
        working-directory: reference
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/reconstruct.json \
            --output "$RUNNER_TEMP/reference-reconstruct"
          runtime-profiler validate --bundle "$RUNNER_TEMP/reference-reconstruct"

      - name: Capture candidate revision evidence
        working-directory: candidate
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/reconstruct.json \
            --output "$RUNNER_TEMP/candidate-reconstruct"
          runtime-profiler validate --bundle "$RUNNER_TEMP/candidate-reconstruct"

      - name: Compare revision runtime evidence
        run: |
          set -euo pipefail
          runtime-profiler score \
            --reference "$RUNNER_TEMP/reference-reconstruct" \
            --candidate "$RUNNER_TEMP/candidate-reconstruct" \
            --json | tee "$RUNNER_TEMP/runtime-reconstruct.json"
          {
            echo '### runtime-profiler revision comparison'
            echo '```json'
            cat "$RUNNER_TEMP/runtime-reconstruct.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate shared golden fixture matrix and reconstruction evidence
        if: always()
        working-directory: candidate
        run: |
          set -uo pipefail
          status=0
          rm -rf target/golden-reference
          for case_name in lateral revisit forward; do
            case_dir="target/golden-reference/$case_name"
            mkdir -p "$case_dir/images"
            if ! target/release/examples/golden_fixture "$case_dir/images" "$case_name" \
              | tee "$RUNNER_TEMP/golden-rust-$case_name.txt"; then
              status=1
            fi
            if ! bash tools/run_colmap_golden.sh \
              "$case_dir/images" \
              "$case_dir/colmap-quality" \
              "$case_name" \
              | tee "$RUNNER_TEMP/golden-colmap-$case_name.txt"; then
              status=1
            fi
          done
          # Reference fixtures with exact truth (#128): the same images go to both pipelines.
          # COLMAP is a reference here, not a gate, so its outcome is recorded either way.
          for case_name in $(python3 tools/check_reference_fixtures.py --list-cases); do
            case_dir="target/golden-reference/$case_name"
            if ! target/release/examples/reference_fixture "$case_dir" "$case_name" \
              | tee "$RUNNER_TEMP/golden-rust-$case_name.txt"; then
              status=1
            fi
            if ! bash tools/run_colmap_golden.sh \
              "$case_dir/images" \
              "$case_dir/colmap-quality" \
              "$case_name" \
              "$(cat "$case_dir/truth/colmap-camera-params.txt")" \
              | tee "$RUNNER_TEMP/golden-colmap-$case_name.txt"; then
              echo "reference fixture $case_name: COLMAP did not complete; recorded, not gated"
            fi
          done
          printf '%s\n' "$status" > "$RUNNER_TEMP/golden-generate.status"
          exit 0

      - name: Capture golden runtime matrix
        if: always()
        working-directory: candidate
        run: |
          set -uo pipefail
          status=0

          capture_case() {
            local case_name="$1"
            local scenario="$2"
            local output="$3"
            local summary="$4"
            GOLDEN_CASE="$case_name" runtime-profiler capture \
              --scenario "$scenario" \
              --output "$output" &&
              runtime-profiler validate --bundle "$output" &&
              runtime-profiler summarize --bundle "$output" --json > "$summary"
          }

          for case_name in lateral revisit forward; do
            if ! capture_case \
              "$case_name" \
              profiles/runtime-profiler/golden-rust.json \
              "$RUNNER_TEMP/golden-rust-runtime-$case_name" \
              "$RUNNER_TEMP/golden-rust-runtime-$case_name.json"; then
              status=1
            fi
            if ! capture_case \
              "$case_name" \
              profiles/runtime-profiler/golden-colmap.json \
              "$RUNNER_TEMP/golden-colmap-runtime-$case_name" \
              "$RUNNER_TEMP/golden-colmap-runtime-$case_name.json"; then
              status=1
            fi
          done
          printf '%s\n' "$status" > "$RUNNER_TEMP/golden-runtime.status"
          exit 0

      - name: Evaluate COLMAP golden quality matrix
        if: always()
        working-directory: candidate
        run: |
          set -uo pipefail
          status=0
          : > "$RUNNER_TEMP/colmap-golden.md"
          for case_name in lateral revisit forward; do
            case_report="$RUNNER_TEMP/colmap-golden-$case_name.md"
            args=(
              --rust "$RUNNER_TEMP/golden-rust-$case_name.txt"
              --colmap "$RUNNER_TEMP/golden-colmap-$case_name.txt"
              --case "$case_name"
              --markdown "$case_report"
            )
            if test -f "$RUNNER_TEMP/golden-rust-runtime-$case_name.json" \
              && test -f "$RUNNER_TEMP/golden-colmap-runtime-$case_name.json"; then
              args+=(
                --rust-runtime "$RUNNER_TEMP/golden-rust-runtime-$case_name.json"
                --colmap-runtime "$RUNNER_TEMP/golden-colmap-runtime-$case_name.json"
              )
            fi
            if ! python3 tools/check_colmap_golden.py "${args[@]}"; then
              status=1
            fi
            if ! python3 tools/check_colmap_match_repeatability.py \
              --reference "target/golden-reference/$case_name/colmap-quality/database.db" \
              --candidate "target/golden-reference/$case_name/colmap-runtime/database.db"; then
              status=1
            fi
            if test -f "$case_report"; then
              cat "$case_report" >> "$RUNNER_TEMP/colmap-golden.md"
              printf '\n' >> "$RUNNER_TEMP/colmap-golden.md"
            fi
          done
          for case_name in $(python3 tools/check_reference_fixtures.py --list-cases); do
            case_report="$RUNNER_TEMP/colmap-golden-$case_name.md"
            if ! python3 tools/check_reference_fixtures.py \
              --case "$case_name" \
              --rust "$RUNNER_TEMP/golden-rust-$case_name.txt" \
              --colmap "$RUNNER_TEMP/golden-colmap-$case_name.txt" \
              --markdown "$case_report"; then
              status=1
            fi
            if test -f "$case_report"; then
              cat "$case_report" >> "$RUNNER_TEMP/colmap-golden.md"
              printf '\n' >> "$RUNNER_TEMP/colmap-golden.md"
            fi
          done
          printf '%s\n' "$status" > "$RUNNER_TEMP/colmap-golden.status"
          exit 0

      - name: Publish COLMAP golden diagnostics
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/colmap-golden.md"; then
            cat "$RUNNER_TEMP/colmap-golden.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Moonlight correctness evaluation
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          cargo run --quiet \
            --manifest-path ../moonlight/Cargo.toml \
            -p moonlight-cli --bin moonlight -- \
            eval run \
            --project moonlight.eval.toml \
            --storage-path .moonlight/runtime-evidence.jsonl \
            --format markdown \
            --baseline-ref "${{ github.event.pull_request.base.sha }}" \
            --candidate-ref "${{ github.event.pull_request.head.sha }}" \
            | tee "$RUNNER_TEMP/moonlight.md"
          {
            echo '### Moonlight evaluation'
            cat "$RUNNER_TEMP/moonlight.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce COLMAP golden matrix
        if: always()
        run: |
          status=0
          for phase in golden-generate golden-runtime colmap-golden; do
            phase_status="$RUNNER_TEMP/$phase.status"
            if ! test -f "$phase_status" || test "$(cat "$phase_status")" != 0; then
              echo "golden-gate: $phase failed or did not report status"
              status=1
            fi
          done
          exit "$status"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reconstruction-runtime-colmap-moonlight-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/reference-reconstruct
            ${{ runner.temp }}/candidate-reconstruct
            ${{ runner.temp }}/runtime-reconstruct.json
            ${{ runner.temp }}/golden-rust-*.txt
            ${{ runner.temp }}/golden-colmap-*.txt
            ${{ runner.temp }}/golden-rust-runtime-*
            ${{ runner.temp }}/golden-colmap-runtime-*
            ${{ runner.temp }}/golden-*.status
            ${{ runner.temp }}/colmap-golden-*.md
            ${{ runner.temp }}/colmap-golden.md
            ${{ runner.temp }}/moonlight.md
            candidate/target/golden-reference/*/truth/truth.json
            candidate/target/golden-reference/*/rust-evidence.json
          if-no-files-found: warn
