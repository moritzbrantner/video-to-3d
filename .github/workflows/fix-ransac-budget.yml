name: Fix calibrated RANSAC budget

on:
  push:
    branches:
      - feat/calibrated-two-view-sfm

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibrated-two-view-sfm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Derive RANSAC budget from confidence and observed consensus
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/video-to-3d-core/src/two_view.rs")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "const RANSAC_ITERATIONS: usize = 96;",
              "const RANSAC_SAMPLE_SIZE: usize = 8;\nconst RANSAC_MIN_ITERATIONS: usize = 96;\nconst RANSAC_CONFIDENCE: f64 = 0.99;",
              "RANSAC constants",
          )

          replace_once(
              "    for iteration in 0..RANSAC_ITERATIONS {",
              "    let mut iteration = 0;\n    let mut iteration_budget = ransac_iteration_budget(MIN_INLIER_RATIO);\n    while iteration < iteration_budget {",
              "RANSAC loop",
          )

          replace_once(
              "            best_essential = Some(essential);\n        }\n    }",
              "            best_essential = Some(essential);\n\n            let observed_inlier_ratio = best_inliers.len() as f64 / correspondences.len() as f64;\n            if observed_inlier_ratio >= MIN_INLIER_RATIO {\n                iteration_budget = iteration_budget.min(\n                    ransac_iteration_budget(observed_inlier_ratio).max(iteration + 1),\n                );\n            }\n        }\n        iteration += 1;\n    }",
              "adaptive RANSAC budget",
          )

          marker = "fn deterministic_sample(len: usize, iteration: usize) -> Vec<usize> {"
          budget_function = '''fn ransac_iteration_budget(inlier_ratio: f64) -> usize {
              if !inlier_ratio.is_finite() || inlier_ratio <= 0.0 {
                  return usize::MAX;
              }

              let all_inlier_probability = inlier_ratio
                  .clamp(0.0, 1.0)
                  .powi(RANSAC_SAMPLE_SIZE as i32);
              if all_inlier_probability >= 1.0 {
                  return RANSAC_MIN_ITERATIONS;
              }
              if all_inlier_probability <= f64::EPSILON {
                  return usize::MAX;
              }

              let miss_probability = 1.0 - all_inlier_probability;
              let required = ((1.0 - RANSAC_CONFIDENCE).ln() / miss_probability.ln()).ceil();
              if !required.is_finite() || required >= usize::MAX as f64 {
                  usize::MAX
              } else {
                  (required as usize).max(RANSAC_MIN_ITERATIONS)
              }
          }

          fn deterministic_sample(len: usize, iteration: usize) -> Vec<usize> {'''
          budget_function = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in budget_function.splitlines()
          )
          replace_once(marker, budget_function, "RANSAC budget function")

          test_marker = "    #[test]\n    fn eight_point_fit_keeps_the_full_right_null_space() {"
          budget_test = '''    #[test]
              fn ransac_budget_meets_confidence_at_admitted_inlier_ratio() {
                  let iterations = ransac_iteration_budget(MIN_INLIER_RATIO);
                  let all_inlier_probability = MIN_INLIER_RATIO.powi(RANSAC_SAMPLE_SIZE as i32);
                  let success_probability =
                      1.0 - (1.0 - all_inlier_probability).powi(iterations as i32);

                  assert!(
                      success_probability >= RANSAC_CONFIDENCE,
                      "success probability: {success_probability} with {iterations} iterations"
                  );
                  assert!(iterations > RANSAC_MIN_ITERATIONS);
                  assert!(ransac_iteration_budget(0.7) < iterations);
                  assert_eq!(ransac_iteration_budget(1.0), RANSAC_MIN_ITERATIONS);
              }

              #[test]
              fn eight_point_fit_keeps_the_full_right_null_space() {'''
          budget_test = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in budget_test.splitlines()
          )
          replace_once(test_marker, budget_test, "RANSAC budget regression")

          path.write_text(text)
      - name: Format Rust
        run: cargo fmt --all
      - name: Test reconstruction core
        run: cargo test -p video-to-3d-core
      - name: Lint reconstruction core
        run: cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit verified RANSAC repair
        shell: bash
        run: |
          rm .github/workflows/fix-ransac-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video-to-3d-core/src/two_view.rs .github/workflows/fix-ransac-budget.yml
          git commit -m "Derive calibrated RANSAC iteration budget"
          git push origin HEAD:feat/calibrated-two-view-sfm
