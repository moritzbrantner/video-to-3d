name: Fix mesh orientation validation

on:
  push:
    branches:
      - feat/dense-mesh-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/dense-mesh-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply signed mesh orientation fix
        run: python scripts/fix_mesh_orientation.py
      - name: Validate mesh orientation fix
        run: |
          cargo fmt --all
          cargo test -p video-to-3d-core
          cargo clippy -p video-to-3d-core --all-targets -- -D warnings
      - name: Commit fix and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/fix-mesh-orientation.yml
          rm scripts/fix_mesh_orientation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject reference-projection mesh winding flips"
          git push origin HEAD:feat/dense-mesh-foundation
