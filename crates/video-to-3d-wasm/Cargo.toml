[package]
name = "video-to-3d-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Direct Serde access selects the JSON-compatible WASM serializer shape and
# derives the WASM-local transport request without leaking it into the core.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
video-to-3d-core = { path = "../video-to-3d-core" }
wasm-bindgen = "=0.2.104"
