[package]
name = "video-to-3d-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
boundary-benchmark = []

[dependencies]
# Direct Serde access selects the browser-facing WASM transport shape and
# derives the WASM-local request without leaking transport details into core.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
video-to-3d-core = { path = "../video-to-3d-core" }
wasm-bindgen = "=0.2.104"
