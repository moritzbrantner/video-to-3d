[package]
name = "video-to-3d-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Direct Serde access selects the JSON-compatible WASM serializer shape.
serde = "1"
serde-wasm-bindgen = "0.6"
video-to-3d-core = { path = "../video-to-3d-core" }
wasm-bindgen = "=0.2.104"
