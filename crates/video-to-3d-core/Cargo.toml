[package]
name = "video-to-3d-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.5"
miniz_oxide = "0.9"
nalgebra = "0.35.0"
serde = { version = "1", features = ["derive"] }
# Stage artifacts store f64 camera poses; their documents must round-trip bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "00f15872f3d4787a455d544442e38ccea138dfa8" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "00f15872f3d4787a455d544442e38ccea138dfa8" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "00f15872f3d4787a455d544442e38ccea138dfa8" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "7ce0c74306466edcc8e046f9773f6107c57111e3" }
three-d-scene = { git = "https://github.com/moritzbrantner/3d-lab", rev = "00f15872f3d4787a455d544442e38ccea138dfa8" }
three-d-export = { git = "https://github.com/moritzbrantner/3d-lab", rev = "00f15872f3d4787a455d544442e38ccea138dfa8" }
