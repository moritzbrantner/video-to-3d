[project]
name = "video-to-3d-semantic-sidecar"
version = "1.0.0"
description = "Local Grounding DINO + SAM 2.1 semantic inventory sidecar (protocol video-to-3d-semantic-sidecar/1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0+cu128",
  "torchvision==0.24.1",
  "transformers==4.57.6",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  # TripoSR (object generation, Atlas 8.10), fetched at a pinned commit on first need.
  "omegaconf==2.3.0",
  "einops==0.8.2",
  "trimesh==4.8.3",
  "scikit-image==0.25.2",
  "imageio==2.37.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
