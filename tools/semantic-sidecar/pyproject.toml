[project]
name = "video-to-3d-semantic-sidecar"
version = "1.0.0"
description = "Local Grounding DINO + SAM 2.1 semantic inventory sidecar (protocol video-to-3d-semantic-sidecar/1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==4.57.3",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
